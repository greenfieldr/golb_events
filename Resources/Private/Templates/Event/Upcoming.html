<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:section name="Main">
    <f:if condition="{occurrences}">
        <f:then>
            <ul class="golbevents-list golbevents-list--upcoming">
                <f:for each="{occurrences}" as="occurrence">
                    <li class="golbevents-list__item">
                        <f:render partial="Occurrence" arguments="{occurrence: occurrence, settings: settings}"/>
                    </li>
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <p class="golbevents-list__empty"><f:translate key="list.empty"/></p>
        </f:else>
    </f:if>
</f:section>
</html>
