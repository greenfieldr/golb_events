<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:section name="Main">
    <f:if condition="{demand.tag} || {demand.tags} || {demand.category}">
        <p class="golb-filter">
            <span class="golb-filter__label"><f:translate key="list.filtered"/></span>
            <f:link.action class="golb-filter__reset"><f:translate key="list.showAll"/></f:link.action>
        </p>
    </f:if>
    <f:if condition="{paginator.paginatedItems}">
        <f:then>
            <ul class="golb-list golbevents-list golbevents-list--list">
                <f:for each="{paginator.paginatedItems}" as="occurrence">
                    <li class="golb-list__item">
                        <f:render partial="Occurrence" arguments="{occurrence: occurrence, settings: settings, contentElementData: contentElementData}"/>
                    </li>
                </f:for>
            </ul>
            <f:render partial="Pagination" arguments="{paginator: paginator, pagination: pagination, demand: demand}"/>
        </f:then>
        <f:else>
            <p class="golb-list__empty golbevents-list__empty"><f:translate key="list.empty"/></p>
        </f:else>
    </f:if>
</f:section>
</html>
