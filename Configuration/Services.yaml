services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Greenfieldr\GolbEvents\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Instantiated by the DataHandler through GeneralUtility::makeInstance()
  Greenfieldr\GolbEvents\Hooks\DataHandlerHook:
    public: true

  Greenfieldr\GolbEvents\Recurrence\OccurrenceSynchronizer:
    public: true

  Greenfieldr\GolbEvents\Property\TypeConverter\DateTimeImmutableConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: DateTimeImmutable
        sources: string,integer,array
